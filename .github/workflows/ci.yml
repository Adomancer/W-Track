name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, Lint & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Run pure-Kotlin integration module tests
        run: |
          ./gradlew :integration:api:test :integration:providers:test \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Run Android app unit & Robolectric tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Run Android Lint
        run: |
          ./gradlew :app:lintDebug \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Verify R8 minified release build & lintVital
        run: |
          ./gradlew :app:assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Build debug APK preview (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            integration/api/build/reports/tests/
            integration/providers/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif

      - name: Upload debug APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: wtrack-debug-apk-${{ github.sha }}
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk
